<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 450" width="100%" height="100%">
  <defs>
    <style>
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .cursor { animation: blink 1s infinite; fill: #38bdf8; }
      .bg { fill: #0a0e17; stroke-width: 1.5; rx: 14px; }
      .bar { fill: #0f172a; stroke: #1e293b; stroke-width: 1; rx: 14px; }
      .bar-mask { fill: #0f172a; }
      .title { fill: #94a3b8; font-family: 'Fira Code', 'Courier New', monospace; font-size: 13px; font-weight: 600; text-anchor: middle; }
      .txt { font-family: 'Fira Code', 'Courier New', Consolas, monospace; font-size: 12.5px; }
      .ascii { fill: #38bdf8; font-family: 'Courier New', Consolas, monospace; font-size: 12px; font-weight: bold; }
      .prompt { fill: #4ade80; font-weight: bold; }
      .user { fill: #38bdf8; font-weight: bold; }
      .host { fill: #a855f7; font-weight: bold; }
      .label { fill: #38bdf8; font-weight: bold; }
      .val { fill: #e2e8f0; }
      .val-accent { fill: #34d399; font-weight: 600; }
      .dim { fill: #64748b; }
      .glow-cyan { filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.45)); }
      .glow-frame { filter: drop-shadow(0 0 15px rgba(56, 189, 248, 0.2)); }
    </style>
    <linearGradient id="cyberBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- Window Frame -->
  <rect x="2" y="2" width="856" height="446" rx="14" class="bg glow-frame" stroke="url(#cyberBorder)" stroke-width="1.5" />
  
  <!-- Header Bar -->
  <rect x="2" y="2" width="856" height="38" rx="14" class="bar" />
  <rect x="2" y="26" width="856" height="14" class="bar-mask" />
  <line x1="2" y1="40" x2="858" y2="40" stroke="#1e293b" stroke-width="1" />

  <!-- Mac Window Dots -->
  <circle cx="22" cy="20" r="6" fill="#ff5f56" />
  <circle cx="40" cy="20" r="6" fill="#ffbd2e" />
  <circle cx="58" cy="20" r="6" fill="#27c93f" />

  <!-- Title -->
  <text x="430" y="25" class="title">tofique@mainframe: ~ (zsh)</text>

  <!-- Command Line Prompt -->
  <text x="25" y="70" class="txt">
    <tspan class="prompt">➜ </tspan>
    <tspan class="user">tofique</tspan><tspan class="dim">@</tspan><tspan class="host">matrix-deck</tspan>
    <tspan class="dim"> ~ git:(main) </tspan>
    <tspan class="val">fastfetch --profile</tspan>
    <tspan class="cursor"> █</tspan>
  </text>

  <!-- Left Side: Cybernetic ASCII Avatar Art -->
  <g class="ascii glow-cyan" transform="translate(30, 102)">
    <text y="0">        .----------------.        </text>
    <text y="17">       /   .-~~~~~~~~-.   \       </text>
    <text y="34">      /  .'            '.  \      </text>
    <text y="51">     /  /  [■■]    [■■]  \  \     </text>
    <text y="68">    |  |       ||         |  |    </text>
    <text y="85">    |  |      ====        |  |    </text>
    <text y="102">    |  |     \____/       |  |    </text>
    <text y="119">     \  \                /  /     </text>
    <text y="136">      \  '.            .'  /      </text>
    <text y="153">       \   '-........-'   /       </text>
    <text y="170">        '----------------'        </text>
    <text y="187">           /|   ||   |\           </text>
    <text y="204">          / |  CORE  | \          </text>
    <text y="221">         /  |  [AI]  |  \         </text>
    <text y="238">        [===]        [===]        </text>
  </g>

  <!-- Divider line -->
  <line x1="250" y1="88" x2="250" y2="425" stroke="#1e293b" stroke-dasharray="3 3" stroke-width="1" />

  <!-- Right Side: Neofetch System Info -->
  <g class="txt" transform="translate(270, 102)">
    <!-- Header -->
    <text y="0" font-size="14.5px">
      <tspan class="user" font-weight="bold">tofique</tspan><tspan class="dim">@</tspan><tspan class="host" font-weight="bold">fullstack-ai-deck</tspan>
    </text>
    <text y="13" class="dim">──────────────────────────────────────────────────────────</text>

    <!-- Info Lines -->
    <text y="34">
      <tspan class="label">OS           : </tspan><tspan class="val">Arch Linux x86_64 // Cloud Native</tspan>
    </text>
    <text y="55">
      <tspan class="label">Role         : </tspan><tspan class="val">Full Stack &amp; AI Systems Engineer</tspan>
    </text>
    <text y="76">
      <tspan class="label">Architecture : </tspan><tspan class="val">Distributed Services, Event-Driven, Clean Core</tspan>
    </text>
    <text y="97">
      <tspan class="label">Uptime       : </tspan><tspan class="val">99.99% // High Availability</tspan>
    </text>
    <text y="118">
      <tspan class="label">Kernel       : </tspan><tspan class="val">Production v6.4-lts</tspan>
    </text>
    <text y="139">
      <tspan class="label">Shell        : </tspan><tspan class="val">zsh 5.9 (powerlevel10k)</tspan>
    </text>
    <text y="160">
      <tspan class="label">Languages    : </tspan><tspan class="val">Python, TypeScript, JavaScript, SQL, Bash</tspan>
    </text>
    <text y="181">
      <tspan class="label">Frameworks   : </tspan><tspan class="val">FastAPI, Next.js, React, Node.js, TailwindCSS</tspan>
    </text>
    <text y="202">
      <tspan class="label">Databases    : </tspan><tspan class="val">PostgreSQL, Redis, Vector Databases</tspan>
    </text>
    <text y="223">
      <tspan class="label">DevOps       : </tspan><tspan class="val">Docker, Git, Linux, CI/CD Automations</tspan>
    </text>
    <text y="244">
      <tspan class="label">Focus        : </tspan><tspan class="val-accent">LLM Systems, Agentic Workflows, Scalable APIs</tspan>
    </text>
    <text y="265">
      <tspan class="label">Motto        : </tspan><tspan class="dim">"Turning complex architecture into elegant software."</tspan>
    </text>

    <!-- Color Palette Swatches -->
    <g transform="translate(0, 290)">
      <rect x="0" width="30" height="15" rx="3" fill="#1e293b" />
      <rect x="35" width="30" height="15" rx="3" fill="#ff5f56" />
      <rect x="70" width="30" height="15" rx="3" fill="#27c93f" />
      <rect x="105" width="30" height="15" rx="3" fill="#ffbd2e" />
      <rect x="140" width="30" height="15" rx="3" fill="#38bdf8" />
      <rect x="175" width="30" height="15" rx="3" fill="#a855f7" />
      <rect x="210" width="30" height="15" rx="3" fill="#34d399" />
      <rect x="245" width="30" height="15" rx="3" fill="#f8fafc" />
    </g>
  </g>
</svg>